name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-quality:
    name: Linux quality gates
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run workspace tests
        run: cargo test --locked --workspace

      - name: Run Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Check CLI help
        run: cargo run --locked -p deployer-cli -- --help

  cli-build:
    name: CLI build (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-amd64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - label: windows-amd64
            os: windows-2025
            target: x86_64-pc-windows-msvc
          - label: macos-amd64
            os: macos-15-intel
            target: x86_64-apple-darwin
          - label: macos-arm64
            os: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install pinned Rust toolchain and target
        shell: bash
        run: |
          rustup show active-toolchain
          rustup target add "${{ matrix.target }}"

      - name: Build CLI
        run: cargo build --locked --release -p deployer-cli --target ${{ matrix.target }}

      - name: Build Linux host installer
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo build --locked --release -p deployer-host --bin dirextalk-host-installer --target ${{ matrix.target }}
